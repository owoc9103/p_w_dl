{{ define "main" }}
<section class="page-hero page-hero--inner">
  <div class="container">
    <p class="eyebrow">{{ .Params.eyebrow | default "Explorar" }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Params.subtitle }}<p class="lead">{{ . }}</p>{{ end }}
  </div>
</section>
<section class="section">
  <div class="container grid-cards">
    {{ range .Pages }}
    <a class="action-tile" href="{{ .RelPermalink }}">
      <h2>{{ .Title }}</h2>
      <p>{{ .Params.summary | default .Summary | truncate 140 }}</p>
      <span class="tile-link">Ver más</span>
    </a>
    {{ end }}
  </div>
</section>
{{ end }}
